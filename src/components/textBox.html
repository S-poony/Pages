<!-- ============= TEXT BOX ENRICHMENT ============= -->
<!-- Copy and paste this block - works multiple times per page -->

  <div class="textbox-instance" data-marker="TEXTBOX_MULTIPASTE" style="position: absolute; z-index: 100; transition: all 0.3s ease; font-family: Inter, sans-serif;">
    <div class="textbox-content p-4 custom-scrollbar"></div>
  </div>

  <script>
  (function() {
      // ============= CONFIGURATION ZONE =============
      const CONFIG = {
          OFFSET_TOP: '120px',
          OFFSET_LEFT: '100px',
          BOX_WIDTH: '350px',
          BACKGROUND_COLOR: 'white',
          BORDER_COLOR: '#e5e7eb',
          BORDER_WIDTH: '1px',
          BOX_SHADOW: '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1)',
          BORDER_RADIUS: '0.5rem',
          SHOW_TITLE: true,
          BOX_TITLE: 'Markdown Entry Example',
          FIXED_HEIGHT_ENABLED: true,
          BOX_HEIGHT: '300px',
          TEXT_CONTENT_MARKDOWN: `
          This component accepts **Markdown**! This allows for much easier text entry compared to raw HTML.

The width is fixed at <span style="font-weight: bold; color: #4f46e5;">350px</span>, forcing the text to wrap automatically.

Since **FIXED_HEIGHT_ENABLED** is set to <span style="font-weight: bold; color: #dc2626;">true</span>, the box maintains a fixed height of <span style="font-weight: bold; color: #dc2626;">300px</span>. Any content that overflows this limit can be viewed by scrolling.

This includes standard [external links](https://s-poony.github.io/Pages/) which open in a new tab. Note the use of backticks for 'code'.

For turn.js, we use the custom link syntax. Click this to simulate jumping to [Page 5]({page:5}).

You can add as much content as you like here. If the content exceeds the fixed height, a scrollbar will appear on the right side of the box, allowing users to scroll through the content without affecting the overall layout of the page.
`//<- be careful not to remove the ending and starting backtick
      };
      // ============= END CONFIGURATION =============

      // CSS (injected once per page)
      if (!document.querySelector('#textbox-scrollbars-css')) {
          const style = document.createElement('style');
          style.id = 'textbox-scrollbars-css';
          style.textContent = `
            .textbox-instance .custom-scrollbar::-webkit-scrollbar { width: 6px; }
            .textbox-instance .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
            .textbox-instance .custom-scrollbar::-webkit-scrollbar-track { background-color: #f1f5f9; }
          `;
          document.head.appendChild(style);
      }

      // Find this instance's container by marker
      const container = document.querySelector('.textbox-instance[data-marker="TEXTBOX_MULTIPASTE"]:last-of-type');
      if (!container) {
          console.error('TextBox: Container not found. Add data-marker="TEXTBOX_MULTIPASTE" to the div.');
          return;
      }

      // Prevent duplicate initialization
      if (container.dataset.initialized === 'true') {
          return;
      }
      container.dataset.initialized = 'true';

      // Clear any existing content and rebuild
      container.innerHTML = '<div class="textbox-content p-4 custom-scrollbar"></div>';
      const contentArea = container.querySelector('.textbox-content');

      // Apply styling
      container.style.top = CONFIG.OFFSET_TOP;
      container.style.left = CONFIG.OFFSET_LEFT;
      container.style.width = CONFIG.BOX_WIDTH;
      container.style.backgroundColor = CONFIG.BACKGROUND_COLOR;
      container.style.border = `${CONFIG.BORDER_WIDTH} solid ${CONFIG.BORDER_COLOR}`;
      container.style.boxShadow = CONFIG.BOX_SHADOW;
      container.style.borderRadius = CONFIG.BORDER_RADIUS;

      // Add title if enabled
      if (CONFIG.SHOW_TITLE) {
          const titleHeader = document.createElement('div');
          titleHeader.className = 'textbox-title';
          titleHeader.style.padding = '1rem';
          titleHeader.style.borderBottom = '1px solid #e5e7eb';
          titleHeader.style.backgroundColor = '#f9fafb';
          titleHeader.style.borderTopLeftRadius = CONFIG.BORDER_RADIUS;
          titleHeader.innerHTML = `<h2 style="font-size: 1.125rem; font-weight: 600; color: #111827;">${CONFIG.BOX_TITLE}</h2>`;
          container.insertBefore(titleHeader, contentArea);
      }

      // Apply height and scrolling
      if (CONFIG.FIXED_HEIGHT_ENABLED) {
          contentArea.style.height = CONFIG.BOX_HEIGHT;
          contentArea.style.overflowY = 'auto';
          contentArea.style.paddingRight = '1.25rem';
      } else {
          contentArea.style.height = 'auto';
          contentArea.style.overflowY = 'visible';
          contentArea.style.paddingRight = '1rem';
      }

      // Markdown parser
      function markdownToHtml(markdown) {
          if (!markdown) return '';

          let html = markdown.trim();

          // Custom Page Links: [text]({page:N})
          html = html.replace(/\[([^\]]+)\]\(\{page:(\d+)\}\)/g, (match, text, page) => {
              return `<a href="#" data-page="${page}" class="page-link" style="color: #9333ea; text-decoration: underline; font-weight: 600;">${text}</a>`;
          });

          // Standard Links: [text](url)
          html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, (match, text, url) => {
              return `<a href="${url}" target="_blank" style="color: #2563eb; text-decoration: underline;">${text}</a>`;
          });

          // Bold: **text** or __text__
          html = html.replace(/(\*\*|__)(.*?)\1/g, '<strong style="font-weight: bold;">$2</strong>');

          // Code Spans: `code`
          html = html.replace(/`([^`]+)`/g, '<code style="background-color: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem;">$1</code>');
          
          // Paragraphs
          html = html.split('\n\n').map(paragraph => {
              if (!paragraph.trim()) return '';
              paragraph = paragraph.trim().replace(/\n/g, ' '); 
              return `<p style="margin-bottom: 0.75rem; font-size: 0.875rem; line-height: 1.5; color: #374151;">${paragraph}</p>`;
          }).join('');

          return html;
      }

      // Inject content
      contentArea.innerHTML = markdownToHtml(CONFIG.TEXT_CONTENT_MARKDOWN);

      // Handle page links
      contentArea.querySelectorAll('.page-link').forEach(link => {
          link.addEventListener('click', (e) => {
              e.preventDefault();
              const pageNumber = parseInt(link.getAttribute('data-page'), 10);
              
              if (typeof $ !== 'undefined' && $('#flipbook').length) {
                  try {
                      $('#flipbook').turn('page', pageNumber);
                  } catch (error) {
                      console.error('turn.js navigation failed:', error);
                  }
              } else {
                  console.error('jQuery or flipbook not available for navigation.');
              }
          });
      });
  })();
  // TEXTBOX_MULTIPASTE_v1 - Do not remove this marker
  </script>
