<div class="text-box-component shadow-xl bg-white border border-gray-200 rounded-t-lg" style="position: absolute; z-index: 100; transition: all 0.3s ease;">
    <div class="text-box-content p-4 custom-scrollbar"></div>
</div>

<script>
(function() {
    // ========== CONFIGURATION ==========
    const CONFIG = {
        OFFSET_TOP: '120px',
        OFFSET_LEFT: '100px',
        BOX_WIDTH: '350px',
        FIXED_HEIGHT_ENABLED: true,
        BOX_HEIGHT: '300px',
        SHOW_TITLE: true,
        BOX_TITLE: 'Markdown Entry Example',
        TEXT_CONTENT_MARKDOWN: `
This component accepts **Markdown**! This allows for much easier text entry compared to raw HTML.

The width is fixed at <span class="font-bold text-indigo-600">350px</span>, forcing the text to wrap automatically.

Since **FIXED_HEIGHT_ENABLED** is set to <span class="font-bold text-red-600">true</span>, the box maintains a fixed height of <span class="font-bold text-red-600">300px</span>. Any content that overflows this limit can be viewed by scrolling.

This includes standard [external links](https://s-poony.github.io/Pages/) which open in a new tab. Note the use of backticks for 'code'.

For turn.js, we use the custom link syntax. Click this to simulate jumping to [Page 5]({page:5}).

**Scrollable Content Check:** This paragraph is intentionally long to demonstrate the scrolling functionality when fixed height is enabled. If you switch \`FIXED_HEIGHT_ENABLED\` to <span class="font-bold text-green-600">false</span> and reload the preview, the box will dynamically grow to fit all this text and the scrollbar will disappear. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.
`,
    };

    // ========== MARKDOWN PARSER ==========
    function markdownToHtml(markdown) {
        if (!markdown) return '';

        let html = markdown.trim();

        // Custom Page Links: [text]({page:N})
        html = html.replace(/\[([^\]]+)\]\(\{page:(\d+)\}\)/g, (match, text, page) => {
            return `<a href="#" data-page="${page}" class="page-link text-purple-600 hover:text-purple-800 underline font-semibold transition duration-150">${text}</a>`;
        });

        // Standard Links: [text](url)
        html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, (match, text, url) => {
            return `<a href="${url}" target="_blank" class="text-blue-600 hover:text-blue-800 underline transition duration-150">${text}</a>`;
        });

        // Bold: **text** or __text__
        html = html.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');

        // Code Spans: `code`
        html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-100 p-1 rounded">$1</code>');
        
        // Paragraphs
        html = html.split('\n\n').map(paragraph => {
            if (!paragraph.trim()) return '';
            paragraph = paragraph.trim().replace(/\n/g, ' '); 
            return `<p class="mb-3 text-sm leading-relaxed text-gray-700">${paragraph}</p>`;
        }).join('');

        return html;
    }

    // ========== INITIALIZATION ==========
    function initComponent() {
        const scriptEl = document.currentScript;
        const boxContainer = scriptEl.previousElementSibling;
        
        if (!boxContainer || !boxContainer.classList.contains('text-box-component')) {
            console.error('Text box component: Could not find container element');
            return;
        }

        const contentArea = boxContainer.querySelector('.text-box-content');

        // Apply positioning and width
        boxContainer.style.top = CONFIG.OFFSET_TOP;
        boxContainer.style.left = CONFIG.OFFSET_LEFT;
        boxContainer.style.width = CONFIG.BOX_WIDTH;

        // Add Title Header
        if (CONFIG.SHOW_TITLE) {
            const titleHeader = document.createElement('div');
            titleHeader.className = 'p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl';
            titleHeader.innerHTML = `<h2 class="text-lg font-semibold text-gray-800">${CONFIG.BOX_TITLE}</h2>`;
            boxContainer.prepend(titleHeader);
        }

        // Apply Height and Scrolling
        if (CONFIG.FIXED_HEIGHT_ENABLED) {
            contentArea.style.height = CONFIG.BOX_HEIGHT;
            contentArea.style.overflowY = 'auto';
            contentArea.classList.add('pr-5');
        } else {
            contentArea.style.height = 'auto';
            contentArea.style.overflowY = 'visible';
            contentArea.classList.add('pr-4');
        }

        // Inject Content
        contentArea.innerHTML = markdownToHtml(CONFIG.TEXT_CONTENT_MARKDOWN);

        // Handle Page-Link Clicks
        boxContainer.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const pageNumber = parseInt(link.getAttribute('data-page'), 10);
                
                if (typeof $ !== 'undefined' && $('#flipbook').length) {
                    try {
                        $('#flipbook').turn('page', pageNumber);
                    } catch (error) {
                        console.error('turn.js navigation failed:', error);
                    }
                } else {
                    console.error('jQuery or flipbook not available. Ensure both are loaded.');
                }
            });
        });
    }

    // ========== DOM READY CHECK ==========
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initComponent);
    } else {
        initComponent();
    }
})();
</script>

<style>
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
.custom-scrollbar::-webkit-scrollbar-track { background-color: #f1f5f9; }
</style>
