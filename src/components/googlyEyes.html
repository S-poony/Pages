<!-- ============= GOOGLY EYES ENRICHMENT ============= -->
<!-- Copy and paste this block - works multiple times per page -->

  <div class="googly-instance" data-marker="GOOGLY_EYES">
    <div class="googly-wrapper" style="position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center;">
      <div class="googly-pair" style="display: flex; gap: 4rem; transform: scale(0.5);">
        <div class="googly-eye" style="width: 180px; height: 180px; background: white; border: 8px solid black; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.7); position: relative;">
          <div class="googly-pupil" style="width: 60px; height: 60px; background: black; border-radius: 9999px; position: absolute; transition: transform 0.05s ease-out;"></div>
        </div>
        <div class="googly-eye" style="width: 180px; height: 180px; background: white; border: 8px solid black; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.7); position: relative;">
          <div class="googly-pupil" style="width: 60px; height: 60px; background: black; border-radius: 9999px; position: absolute; transition: transform 0.05s ease-out;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function() {
      // --- CONFIGURATION ---
      const CONFIG = {
          scaleFactor: 0.5, 
          showLeftEye: true,
          showRightEye: true,
          containerAlign: 'center', // 'center', 'start', 'end'
          offsetX: 0, 
          offsetY: 0,
      };
      // --- END CONFIGURATION ---

      // Find container by data-marker instead of sibling position
      const container = document.querySelector('.googly-instance[data-marker="GOOGLY_EYES"]:last-of-type');
      if (!container) {
          console.error('Googly Eyes: Container with data-marker="GOOGLY_EYES" not found');
          return;
      }

      const wrapper = container.querySelector('.googly-wrapper');
      const pair = container.querySelector('.googly-pair');
      const eyes = container.querySelectorAll('.googly-eye');
      const pupils = container.querySelectorAll('.googly-pupil');

      if (!eyes[0] || !pupils[0]) {
          console.warn("Googly Eyes: Eye elements not found");
          return;
      }

      // Apply config
      switch(CONFIG.containerAlign) {
          case 'start':
              wrapper.style.justifyContent = 'flex-start';
              break;
          case 'end':
              wrapper.style.justifyContent = 'flex-end';
              break;
          default:
              wrapper.style.justifyContent = 'center';
      }

      let transform = '';
      if (CONFIG.scaleFactor !== 1.0) transform += `scale(${CONFIG.scaleFactor}) `;
      if (CONFIG.offsetX !== 0 || CONFIG.offsetY !== 0) transform += `translate(${CONFIG.offsetX}px, ${CONFIG.offsetY}px)`;
      pair.style.transform = transform.trim();
      pair.style.transformOrigin = 'center';

      eyes[0].style.display = CONFIG.showLeftEye ? 'flex' : 'none';
      eyes[1].style.display = CONFIG.showRightEye ? 'flex' : 'none';

      // Pupil tracking
      const PUPIL_LIMIT = 50;
      function onMouseMoveEyes(event) {
          const mouseX = event ? event.clientX : 0;
          const mouseY = event ? event.clientY : 0;

          pupils.forEach((pupil, i) => {
              if (pupil.style.display === 'none') return;
              const eye = eyes[i];
              const rect = eye.getBoundingClientRect();
              const centerX = rect.left + rect.width / 2;
              const centerY = rect.top + rect.height / 2;
              const dx = mouseX - centerX;
              const dy = mouseY - centerY;
              const dist = Math.min(PUPIL_LIMIT, Math.sqrt(dx*dx + dy*dy));
              const angle = Math.atan2(dy, dx);
              pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
          });
      }

      window.addEventListener('mousemove', onMouseMoveEyes, false);
      window.addEventListener('resize', onMouseMoveEyes, false);
      onMouseMoveEyes();
  })();
  </script>
  <!-- ============= GOOGLY EYES END ============= -->
